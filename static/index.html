<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveInfinity | Cloud Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans relative">

    <!-- Login Overlay (The Vault Door) -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-900 z-[100] flex items-center justify-center transition-opacity duration-300">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700 w-full max-w-md text-center">
            <h2 class="text-2xl font-bold text-indigo-400 mb-2">DriveInfinity Vault</h2>
            <p class="text-gray-400 text-sm mb-6">Enter your master password to access your cloud.</p>
            <form id="login-form" class="space-y-4">
                <input type="password" id="password-input" placeholder="Master Password" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-indigo-500 transition">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition">Unlock Vault</button>
            </form>
            <p id="login-error" class="text-red-400 text-sm mt-4 hidden">Incorrect password. Access denied.</p>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="border-b border-gray-800 bg-gray-900 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-indigo-400">DRIVEINFINITY<span class="text-xs text-gray-500 font-mono">.us.kg</span></h1>
            <div class="flex items-center gap-4">
                <div id="connection-status" class="text-xs bg-green-900/50 text-green-400 border border-green-800 px-3 py-1 rounded-full flex items-center gap-1.5">
                    <span class="h-2 w-2 rounded-full bg-green-400 animate-pulse"></span> Connected
                </div>
                <button id="logout-btn" class="text-xs text-gray-400 hover:text-white transition">Lock Vault</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <!-- Control Panel / Upload Zone -->
        <div class="bg-gray-800/50 border border-gray-800 rounded-2xl p-6 mb-8 backdrop-blur-sm">
            <h2 class="text-lg font-semibold mb-4 text-gray-200">Upload New File</h2>
            <div class="flex flex-col sm:flex-row gap-4 items-center">
                <input type="file" id="file-input" class="block w-full text-sm text-gray-400
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-full file:border-0
                    file:text-sm file:font-semibold
                    file:bg-indigo-600 file:text-white
                    hover:file:bg-indigo-500 file:cursor-pointer cursor-pointer" />
                <button id="upload-btn" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2 rounded-full transition-all duration-200 shadow-lg shadow-indigo-600/20 active:scale-95 disabled:opacity-50">
                    Upload to Telegram
                </button>
            </div>
            
            <!-- True Progress Bar -->
            <div id="progress-container" class="mt-4 hidden">
                <div class="flex justify-between text-xs text-gray-400 mb-1">
                    <span id="progress-status">Uploading: <span id="progress-percent" class="text-indigo-400 font-bold">0%</span></span>
                    <span id="progress-eta">ETA: Calculating...</span>
                </div>
                <div class="w-full bg-gray-700 h-2 rounded-full overflow-hidden mb-2">
                    <div id="progress-bar" class="bg-indigo-500 h-full w-0 transition-all duration-100 shadow-[0_0_10px_rgba(99,102,241,0.8)]"></div>
                </div>
                <div class="flex justify-between items-center text-xs text-gray-500">
                    <span id="progress-speed">0 MB/s</span>
                    <button id="cancel-upload-btn" class="text-red-400 hover:text-red-300 font-medium transition">Cancel Upload</button>
                </div>
            </div>
        </div>

        <!-- Files List -->
        <div class="bg-gray-800/50 border border-gray-800 rounded-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-800 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-gray-200">Your Secure Files</h2>
                <button id="refresh-btn" class="text-sm text-gray-400 hover:text-white transition">Refresh List</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-xs uppercase text-gray-400 bg-gray-800/30 border-b border-gray-800">
                            <th class="px-6 py-3">File Name</th>
                            <th class="px-6 py-3">Size</th>
                            <th class="px-6 py-3">Uploaded On</th>
                            <th class="px-6 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="files-table-body" class="divide-y divide-gray-800/50 text-sm">
                        <!-- Dynamic rows injected by JavaScript -->
                    </tbody>
                </table>
            </div>
            <div id="empty-state" class="text-center py-12 text-gray-500 hidden">
                Vault is empty. Select a file above to begin.
            </div>
        </div>
    </main>

    <!-- ALL JAVASCRIPT LOGIC -->
    <script>
        const API_BASE = "http://localhost:8000/api"; // Change this to window.location.origin + "/api" in production
        let currentXHR = null;
        let vaultPassword = localStorage.getItem("vault_pwd");

        // --- AUTHENTICATION LOGIC ---
        const loginOverlay = document.getElementById("login-overlay");
        const loginError = document.getElementById("login-error");

        // Handle Login Attempt
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const pwd = document.getElementById("password-input").value;
            
            try {
                // Test the password against the backend
                const res = await fetch(`${API_BASE}/files`, {
                    headers: { "Authorization": `Bearer ${pwd}` }
                });
                
                if (res.ok) {
                    vaultPassword = pwd;
                    localStorage.setItem("vault_pwd", vaultPassword);
                    loginOverlay.classList.add("hidden");
                    loginError.classList.add("hidden");
                    loadFiles(); // Load the dashboard
                } else {
                    loginError.classList.remove("hidden");
                }
            } catch (err) {
                alert("Cannot connect to backend server.");
            }
        });

        // Handle Logout
        document.getElementById("logout-btn").addEventListener("click", () => {
            localStorage.removeItem("vault_pwd");
            vaultPassword = null;
            document.getElementById("password-input").value = "";
            document.getElementById("files-table-body").innerHTML = ""; // Clear table for security
            loginOverlay.classList.remove("hidden");
        });

        // --- HELPER FUNCTIONS ---
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // --- DASHBOARD LOGIC (SECURED) ---
        async function loadFiles() {
            if (!vaultPassword) return; // Prevent fetching if not logged in

            try {
                const res = await fetch(`${API_BASE}/files`, {
                    headers: { "Authorization": `Bearer ${vaultPassword}` }
                });

                // If token is invalid (e.g. server restarted with new password)
                if (res.status === 401 || res.status === 403) {
                    document.getElementById("logout-btn").click();
                    return;
                }

                const files = await res.json();
                const tbody = document.getElementById("files-table-body");
                const emptyState = document.getElementById("empty-state");
                
                tbody.innerHTML = "";
                if (files.length === 0) {
                    emptyState.classList.remove("hidden");
                    return;
                }
                emptyState.classList.add("hidden");

                files.forEach(file => {
                    // Ensure the browser knows the incoming time is UTC by appending 'Z'
        let dateString = file.upload_date;
        if (!dateString.endsWith("Z")) {
            dateString += "Z"; 
        }

                    // Force the display into Indian Standard Time (IST)
                    const date = new Date(dateString).toLocaleString("en-IN", {
                        timeZone: "Asia/Kolkata",
                        year: "numeric",
                        month: "short",
                        day: "numeric",
                        hour: "2-digit",
                        minute: "2-digit",
                        hour12: true
                    });
                    const row = document.createElement("tr");
                    row.className = "hover:bg-gray-800/20 transition-colors";
                    row.innerHTML = `
                        <td class="px-6 py-4 font-medium text-gray-200 max-w-xs truncate" title="${file.filename}">${file.filename}</td>
                        <td class="px-6 py-4 text-gray-400 whitespace-nowrap">${formatBytes(file.total_size)}</td>
                        <td class="px-6 py-4 text-gray-400 whitespace-nowrap">${date}</td>
                        <td class="px-6 py-4 text-right flex justify-end gap-4">
                            <button onclick="downloadFile('${file._id}')" class="text-indigo-400 hover:text-indigo-300 font-medium transition">Download</button>
                            <button onclick="deleteFile('${file._id}')" class="text-red-400 hover:text-red-300 font-medium transition">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error("Error loading files:", err);
            }
        }

        // --- UPLOAD LOGIC (SECURED) ---
        document.getElementById("upload-btn").addEventListener("click", () => {
            const fileInput = document.getElementById("file-input");
            if (fileInput.files.length === 0) return alert("Please select a file to upload.");
            
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("file", file);

            const uploadBtn = document.getElementById("upload-btn");
            const progressContainer = document.getElementById("progress-container");
            const progressBar = document.getElementById("progress-bar");
            const progressPercent = document.getElementById("progress-percent");
            const progressEta = document.getElementById("progress-eta");
            const progressSpeed = document.getElementById("progress-speed");
            
            // UI State change
            uploadBtn.disabled = true;
            uploadBtn.innerText = "Uploading...";
            progressContainer.classList.remove("hidden");
            progressBar.style.width = "0%";
            
            const startTime = Date.now();

            currentXHR = new XMLHttpRequest();
            currentXHR.open("POST", `${API_BASE}/upload`);
            
            // 🔒 Attach the Vault Password to the Upload Request
            currentXHR.setRequestHeader("Authorization", `Bearer ${vaultPassword}`);

            // Track Progress
            currentXHR.upload.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percentComplete = Math.round((event.loaded / event.total) * 100);
                    progressBar.style.width = `${percentComplete}%`;
                    progressPercent.innerText = `${percentComplete}%`;

                    const timeElapsedInSeconds = (Date.now() - startTime) / 1000;
                    if (timeElapsedInSeconds > 0) {
                        const bytesPerSecond = event.loaded / timeElapsedInSeconds;
                        const remainingBytes = event.total - event.loaded;
                        const secondsRemaining = Math.round(remainingBytes / bytesPerSecond);

                        progressSpeed.innerText = `${(bytesPerSecond / (1024 * 1024)).toFixed(2)} MB/s`;

                        if (secondsRemaining > 60) {
                            progressEta.innerText = `ETA: ${Math.floor(secondsRemaining / 60)}m ${secondsRemaining % 60}s`;
                        } else {
                            progressEta.innerText = `ETA: ${secondsRemaining}s`;
                        }
                    }
                }
            };

            // Handle Completion
            currentXHR.onload = async () => {
                uploadBtn.disabled = false;
                uploadBtn.innerText = "Upload to Telegram";
                progressContainer.classList.add("hidden");
                
                if (currentXHR.status >= 200 && currentXHR.status < 300) {
                    fileInput.value = "";
                    await loadFiles();
                } else if (currentXHR.status === 401 || currentXHR.status === 403) {
                    alert("Unauthorized. Please log in again.");
                    document.getElementById("logout-btn").click();
                } else {
                    alert("Upload failed or was cancelled.");
                }
                currentXHR = null;
            };

            // Handle Network Errors
            currentXHR.onerror = () => {
                alert("Network error occurred.");
                uploadBtn.disabled = false;
                uploadBtn.innerText = "Upload to Telegram";
                progressContainer.classList.add("hidden");
                currentXHR = null;
            };

            // Start the upload
            currentXHR.send(formData);
        });

        // Handle Upload Cancellation
        document.getElementById("cancel-upload-btn").addEventListener("click", () => {
            if (currentXHR) {
                currentXHR.abort(); 
                document.getElementById("progress-container").classList.add("hidden");
                const uploadBtn = document.getElementById("upload-btn");
                uploadBtn.disabled = false;
                uploadBtn.innerText = "Upload to Telegram";
                document.getElementById("file-input").value = ""; 
                alert("Upload cancelled. Temporary chunks have been cleared.");
                currentXHR = null;
            }
        });

        // --- DOWNLOAD & DELETE LOGIC (SECURED) ---
        function downloadFile(fileId) {
            // 🔒 Attach the password to the URL for streaming
            window.location.href = `${API_BASE}/download/${fileId}?pwd=${encodeURIComponent(vaultPassword)}`;
        }

        async function deleteFile(fileId) {
            if (!confirm("Are you sure you want to permanently delete this file?")) return;
            try {
                const res = await fetch(`${API_BASE}/delete/${fileId}`, { 
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${vaultPassword}` } // 🔒 Attach password
                });
                
                if (res.ok) {
                    await loadFiles();
                } else if (res.status === 401 || res.status === 403) {
                    alert("Unauthorized.");
                } else {
                    alert("Deletion failed.");
                }
            } catch (err) {
                console.error(err);
            }
        }

        // --- INITIALIZATION ---
        document.getElementById("refresh-btn").addEventListener("click", loadFiles);
        
        // Auto-login check on page load
        if (vaultPassword) {
            loadFiles().then(() => {
                // If loadFiles succeeds, hide the overlay. 
                // If it fails (invalid token), loadFiles will trigger the logout button automatically.
                if (vaultPassword) loginOverlay.classList.add("hidden");
            });
        }
    </script>
</body>
</html>
